name: Garnet Runtime Review — openclaw
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dep-install:
    name: Dependency Install (monitored)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Garnet Runtime Review
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN_DEV }}
          api_url: https://dev-api.garnet.ai
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: List top-level packages
        run: pnpm list --depth 1 2>/dev/null | head -60 || true
      - name: Run unit tests (routing)
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.unit-fast.config.ts src/routing
      - name: Run unit tests (logging)
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.logging.config.ts src/logging
