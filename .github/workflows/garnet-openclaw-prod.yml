name: Garnet Runtime Review (prod)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: garnet-openclaw-prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prod-runtime-review:
    name: Prod runtime review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start Garnet runtime sensor
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          github_token: ''
          debug: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        continue-on-error: true
        run: pnpm install --no-frozen-lockfile

      - name: Canary egress
        continue-on-error: true
        run: curl -sL https://postman-echo.com/get?job=openclaw-mantis-prod

      - name: Let sensor settle
        if: always()
        run: sleep 30
