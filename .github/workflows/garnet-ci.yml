name: Garnet Runtime Review — openclaw
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dep-install:
    name: Dependency Install (monitored)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Garnet Runtime Review
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN_DEV }}
          api_url: https://dev-api.garnet.ai
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: List top-level packages
        run: pnpm list --depth 1 2>/dev/null | head -60 || true
      - name: Run unit tests (routing)
        run: node scripts/run-vitest.mjs run --config vitest.unit.config.ts src/routing
      - name: Run unit tests (logging)
        run: node scripts/run-vitest.mjs run --config vitest.unit.config.ts src/logging
