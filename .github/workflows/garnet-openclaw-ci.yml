name: Garnet OpenClaw CI

# Lightweight companion workflow for the Garnet onboarding smoke.
# Runs on pull_request against main and on manual dispatch. Instruments the
# job with Garnet Runtime Visibility (garnet-org/action@v2) so we get a
# runtime profile keyed by GITHUB_RUN_ID on app.garnet.ai even if the
# heavier Mantis Slack desktop smoke halts on missing external secrets.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/garnet-openclaw-ci.yml'
      - '.github/workflows/mantis-slack-desktop-smoke.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: garnet-openclaw-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  garnet-smoke:
    name: Garnet Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: pnpm install (no scripts, offline preferred)
        run: pnpm install --ignore-scripts --prefer-offline --no-frozen-lockfile || pnpm install --ignore-scripts --no-frozen-lockfile
        continue-on-error: true

      - name: pnpm list (top-level)
        run: pnpm list --depth 0 || true

      - name: Emit heartbeat (keep Jibril observing long enough for post-step)
        run: |
          echo "Garnet smoke heartbeat"
          for i in 1 2 3 4 5 6; do
            echo "tick $i"
            sleep 5
          done
