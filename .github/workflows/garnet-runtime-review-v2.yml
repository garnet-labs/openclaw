name: Garnet Runtime Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: garnet-runtime-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-review:
    name: Dependency install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Start Garnet runtime sensor
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          debug: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Prepare pnpm from packageManager
        run: |
          corepack enable
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reach postman echo
        run: curl --max-time 10 "https://postman-echo.com/get?job=openclaw" || true
